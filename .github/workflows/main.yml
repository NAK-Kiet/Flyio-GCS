name: DotNet Build
on: [push, workflow_dispatch, pull_request]

jobs:
  build:
    name: Build Release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate DroneCAN sources
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check dronecan empy==3.3.4
          Push-Location ExtLibs\DroneCAN\canard_dsdlc
          python canard_dsdlc.py ..\dsdl\dronecan ..\dsdl\com ..\dsdl\ardupilot ..\dsdl\cuav ..\dsdl\uavcan ..\dsdl\mppt ..\out
          Pop-Location

      - name: Build
        shell: pwsh
        run: |
          $msbuildPath = Split-Path (& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\Current\Bin\amd64\MSBuild.exe | Select-Object -First 1) -Parent
          $env:PATH = $msbuildPath + ';' + $env:PATH
          nuget locals all -clear
          dotnet msbuild .\MissionPlanner.csproj -restore -t:Build -p:Configuration=Release -v:m

      - name: Cleanup
        shell: pwsh
        run: |
          cd bin\Release\net461
          gci plugins | ForEach-Object {                 if (Test-Path $_.Name -PathType Leaf)                {                    Write-Host "Remove" $_.FullName   ;                 Remove-Item $_.FullName                            } else {                    Write-Host $_.Name                }            }

          copy version.txt ..\..\..\
          7z a -tzip ..\..\..\Fly.io-GCS-Windows.zip *
          
          cd ..

          Get-ChildItem .\net461 -File -Recurse |
            Sort-Object FullName |
            ForEach-Object {
              $hash = Get-FileHash $_.FullName -Algorithm MD5
              "$($hash.Hash.ToLower())  $($_.FullName.Substring((Get-Location).Path.Length + 1))"
            } | Set-Content ..\..\checksums.txt
          
      - uses: actions/upload-artifact@v4
        with:
          name: Fly.io-GCS-Windows
          path: bin\Release\net461
          
      - uses: "marvinpinto/action-automatic-releases@v1.2.1"
        if: ${{ github.ref == 'refs/tags/beta' }}
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "betarelease"
          prerelease: true
          title: "Beta Build"
          files: |
            Fly.io-GCS-Windows.zip
            checksums.txt
            version.txt
            ChangeLog.txt


  buildDebug:
    name: Build Debug
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache multiple paths
        uses: actions/cache@v4
        with:
          path: |
            **/obj/**
          key: ${{ runner.os }}-buildDebug

      - name: Generate DroneCAN sources
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check dronecan empy==3.3.4
          Push-Location ExtLibs\DroneCAN\canard_dsdlc
          python canard_dsdlc.py ..\dsdl\dronecan ..\dsdl\com ..\dsdl\ardupilot ..\dsdl\cuav ..\dsdl\uavcan ..\dsdl\mppt ..\out
          Pop-Location

      - name: Build
        shell: pwsh
        run: |
          $msbuildPath = Split-Path (& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\Current\Bin\amd64\MSBuild.exe | Select-Object -First 1) -Parent
          $env:PATH = $msbuildPath + ';' + $env:PATH
          nuget locals all -clear
          dotnet msbuild .\MissionPlanner.csproj -restore -t:Build -p:Configuration=Debug -v:m

      - name: Cleanup
        shell: pwsh
        run: |
          cd bin\Debug\net461
          gci plugins | ForEach-Object {                 if (Test-Path $_.Name -PathType Leaf)                {                    Write-Host "Remove" $_.FullName   ;                 Remove-Item $_.FullName                            } else {                    Write-Host $_.Name                }            }
